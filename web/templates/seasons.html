{% extends "base.html" %}
{% block title %}Seasons · NFL Pro Spectre{% endblock %}
{% block content %}
<h1>Seasons</h1>
<div class="season-grid">
  {% for s in seasons %}
  <a class="card season-card" href="/seasons/{{ s }}">
    <b>{{ s }}</b>
    <span class="muted small">{% if s in champs %}Champion: {{ champs[s].team_name }}{% else %}In progress{% endif %}</span>
  </a>
  {% endfor %}
</div>
{% endblock %}
